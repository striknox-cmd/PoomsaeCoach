name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o PoomsaeCoach-Android-MVP.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Align Java and Kotlin targets
        run: |
          sed -i '/buildFeatures { compose = true }/a\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }' PoomsaeCoach/app/build.gradle.kts

      - name: Build debug APK
        working-directory: PoomsaeCoach
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoomsaeCoach-APK
          path: PoomsaeCoach/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
